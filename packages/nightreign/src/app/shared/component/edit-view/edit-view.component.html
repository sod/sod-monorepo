<app-panel [title]="'Edit View'" theme="form">
    <app-input label="Name" class="d-block mb-2">
        <input appInputControl type="text" [(ngModel)]="name" />
    </app-input>
    <app-input label="Minium match count (1, 2 or 3)" class="d-block mb-2">
        <input appInputControl type="number" min="1" max="3" [(ngModel)]="count" />
    </app-input>
    @for (query of queries(); track $index) {
        <app-autosuggest
            [label]="'Filter'"
            [(model)]="query"
            (modelChange)="expandQueries()"
            [items]="relicProperties"
            class="mb-2 d-block"
            [strategy]="'string'"
        />
    }

    <div class="d-flex justify-content-between mt-3">
        <button class="btn btn-outline-primary" (click)="saveClicked()">
            <i class="bi bi-cloud"></i>
            Save
        </button>
        <button class="btn btn-outline-danger" (click)="delete.emit(toRelicViewDto())">
            <i class="bi bi-trash"></i>
            Delete
        </button>
    </div>
</app-panel>
